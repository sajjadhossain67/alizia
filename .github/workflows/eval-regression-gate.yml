name: Evaluation Regression Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  eval-gate:
    name: Gated Model Evaluation & Regression Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Contamination Check
        run: |
          python -m ai.evals.cli decontaminate

      - name: Run Gated Evaluation Suite
        run: |
          python -m ai.evals.cli run \
            --model alizia-nova \
            --output docs/evals/baseline.md \
            --json-out docs/evals/latest_run.json

      - name: Verify Regression Gate
        run: |
          echo "Regression check: verifying zero quality drops > 1 point and zero latency regressions > 5%."
          python -c "
          import json, sys
          with open('docs/evals/latest_run.json') as f:
              data = json.load(f)
          if not data.get('passed_ci_gate', False):
              print('CI GATE FAILED: Regression detected!')
              for v in data.get('regression_violations', []):
                  print(f'  - {v}')
              sys.exit(1)
          print('CI GATE PASSED: All benchmark suites within quality & latency boundaries.')
          "

      - name: Archive Evaluation Report
        uses: actions/upload-artifact@v4
        with:
          name: alizia-eval-baseline-report
          path: |
            docs/evals/baseline.md
            docs/evals/latest_run.json
